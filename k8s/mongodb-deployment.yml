apiVersion: apps/v1
kind: Deployment
metadata: 
  name: mongodb-deployment
  namespace: chatt-app
spec:
   replicas: 1
   selector: 
     matchLabels:
       app: mongodb
   template:
     metadata:
       name: mongodb-pod
       namespace: chatt-app
       labels: 
        app: mongodb
     spec:
       containers:
       - name: chatt-app-mongodb
         image: mongo:latest
         ports:
         - containerPort: 27017
         env:
         - name: MONGO_INITDB_ROOT_USERNAME
           value: mongodb
         - name: MONGO_INITDB_ROOT_PASSWORD
           value: password
       volumes:
       - name: mongodb-data
         persistentVolumeClaim:
           claimName: mongodb-pvc
